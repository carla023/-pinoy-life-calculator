<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinoy Life Calculator</title>
<style>
body{font-family:Arial;margin:0;background:#f5fbff;text-align:center;color:#333}
header{background:#00A898;color:white;padding:25px 15px;border-radius:0 0 25px 25px}
h1{margin:0;font-size:25px}
main{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{background:white;border:0;border-radius:18px;padding:20px 8px;font-size:15px;box-shadow:0 3px 10px #ccc}
.icon{font-size:30px;display:block;margin-bottom:7px}
#calc{display:none;text-align:left}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:18px;margin:8px 0 15px}
.calcbtn{width:100%;background:#00A898;color:white}
.back{background:#58c9ff;color:white;width:100%;margin-bottom:15px}
.result{background:#fff4c7;padding:18px;border-radius:15px;margin-top:15px;font-size:16px}
</style>
</head>
<body>

<header>
<h1>🇵🇭 Pinoy Life Calculator</h1>
<p>Simple financial tools for Filipinos</p>
</header>

<main id="home">
<h2>💰 Financial Tools</h2>
<div class="grid">

<button onclick="showCalc()">
<span class="icon">💰</span>Salary Calculator
</button>

<button onclick="alert('BIR Tax Calculator coming soon!')">
<span class="icon">🧾</span>BIR Tax
</button>

<button onclick="alert('SSS Calculator coming soon!')">
<span class="icon">🏦</span>SSS Calculator
</button>

<button onclick="alert('Pag-IBIG Calculator coming soon!')">
<span class="icon">🏠</span>Pag-IBIG
</button>

<button onclick="alert('Budget Planner coming soon!')">
<span class="icon">📊</span>Budget Planner
</button>

<button onclick="alert('Savings Goal coming soon!')">
<span class="icon">🎯</span>Savings Goal
</button>

</div>
</main>

<main id="calc">

<button class="back" onclick="goHome()">← Back</button>

<h2>💰 Salary Calculator</h2>

<label>Monthly Basic Salary</label>
<input id="salary" type="number" placeholder="Example: 20000">

<button class="calcbtn" onclick="calculate()">Calculate</button>

<div id="result" class="result" style="display:none"></div>

</main>

<script>

function showCalc(){
document.getElementById("home").style.display="none";
document.getElementById("calc").style.display="block";
}

function goHome(){
document.getElementById("calc").style.display="none";
document.getElementById("home").style.display="block";
}

function sssContribution(salary){

let msc=Math.max(5000,Math.min(35000,Math.ceil(salary/500)*500));

return msc*0.05;

}

function calculate(){

let s=Number(document.getElementById("salary").value);

if(s<=0){
alert("Please enter your monthly salary.");
return;
}

let sss=sssContribution(s);

let phil=s*0.025;

let pagibig=Math.min(s*0.02,100);

let taxable=Math.max(0,s-sss-phil-pagibig);

let tax=0;

if(taxable<=20833)
tax=0;

else if(taxable<=33333)
tax=(taxable-20833)*0.15;

else if(taxable<=66667)
tax=1875+(taxable-33333)*0.20;

else if(taxable<=166667)
tax=8541.80+(taxable-66667)*0.25;

else if(taxable<=666667)
tax=33541.80+(taxable-166667)*0.30;

else
tax=183541.80+(taxable-666667)*0.35;

let total=sss+phil+pagibig+tax;

let net=s-total;

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
"<b>Estimated Deductions</b><br><br>"+
"SSS: ₱"+sss.toFixed(2)+"<br>"+
"PhilHealth: ₱"+phil.toFixed(2)+"<br>"+
"Pag-IBIG: ₱"+pagibig.toFixed(2)+"<br>"+
"BIR Tax: ₱"+tax.toFixed(2)+"<br><br>"+
"<b>Total Deductions: ₱"+total.toFixed(2)+"</b><br><br>"+
"<b>Estimated Take-home Pay: ₱"+net.toFixed(2)+"</b>";

}

</script>

</body>
</html>
