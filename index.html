<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinoy Life Calculator</title>

<style>
body{font-family:Arial;margin:0;background:#f5fbff;color:#333;text-align:center}
header{background:#00A898;color:white;padding:25px 15px;border-radius:0 0 25px 25px}
h1{margin:0;font-size:25px}
main{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{background:white;border:0;border-radius:18px;padding:20px 8px;font-size:15px;box-shadow:0 3px 10px #ccc}
.icon{font-size:30px;display:block;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:18px;margin:8px 0 15px}
.calcbtn{width:100%;background:#00A898;color:white}
.back{background:#58c9ff;color:white;width:100%;margin-bottom:15px}
.result{background:#fff4c7;padding:18px;border-radius:15px;margin-top:15px;text-align:left}
#salary,#bir,#sss,#pagibig,#budget{display:none;text-align:left}
</style>
</head>

<body>

<header>
<h1>🇵🇭 Pinoy Life Calculator</h1>
<p>Simple financial tools for Filipinos</p>
</header>

<main id="home">
<h2>💰 Financial Tools</h2>

<div class="grid">

<button onclick="openPage('salary')">
<span class="icon">💰</span>Salary Calculator
</button>

<button onclick="openPage('bir')">
<span class="icon">🧾</span>BIR Tax
</button>

<button onclick="openPage('sss')">
<span class="icon">🏦</span>SSS Calculator
</button>

<button onclick="openPage('pagibig')">
<span class="icon">🏠</span>Pag-IBIG
</button>

<button onclick="openPage('budget')">
<span class="icon">📊</span>Budget Planner
</button>

<button onclick="alert('Savings Goal coming soon!')">
<span class="icon">🎯</span>Savings Goal
</button>

</div>
</main>

<main id="salary">

<button class="back" onclick="home()">← Back</button>

<h2>💰 Salary Calculator</h2>

<label>Monthly Basic Salary</label>
<input id="salaryInput" type="number" placeholder="Example: 20000">

<button class="calcbtn" onclick="salaryCalc()">Calculate</button>

<div id="salaryResult" class="result" style="display:none"></div>

</main>

<main id="bir">

<button class="back" onclick="home()">← Back</button>

<h2>🧾 BIR Tax Calculator</h2>

<label>Monthly Taxable Income</label>
<input id="birInput" type="number" placeholder="Example: 20000">

<button class="calcbtn" onclick="birCalc()">Calculate</button>

<div id="birResult" class="result" style="display:none"></div>

</main>

<main id="sss">

<button class="back" onclick="home()">← Back</button>

<h2>🏦 SSS Calculator</h2>

<label>Monthly Salary</label>
<input id="sssInput" type="number" placeholder="Example: 20000">

<button class="calcbtn" onclick="sssCalc()">Calculate</button>

<div id="sssResult" class="result" style="display:none"></div>

</main>

<main id="pagibig">

<button class="back" onclick="home()">← Back</button>

<h2>🏠 Pag-IBIG Calculator</h2>

<label>Monthly Salary</label>
<input id="pagibigInput" type="number" placeholder="Example: 20000">

<button class="calcbtn" onclick="pagibigCalc()">Calculate</button>

<div id="pagibigResult" class="result" style="display:none"></div>

</main>

<main id="budget">

<button class="back" onclick="home()">← Back</button>

<h2>📊 Budget Planner</h2>

<label>Monthly Income</label>
<input id="budgetIncome" type="number" placeholder="Example: 20000">

<label>🏠 Rent / Housing</label>
<input id="rent" type="number" placeholder="₱">

<label>🍚 Food / Groceries</label>
<input id="food" type="number" placeholder="₱">

<label>💡 Electricity</label>
<input id="electricity" type="number" placeholder="₱">

<label>💧 Water</label>
<input id="water" type="number" placeholder="₱">

<label>📱 Internet / Load</label>
<input id="internet" type="number" placeholder="₱">

<label>🚗 Transportation</label>
<input id="transport" type="number" placeholder="₱">

<label>👶 Family / Children</label>
<input id="family" type="number" placeholder="₱">

<label>💳 Debt / Loans</label>
<input id="debt" type="number" placeholder="₱">

<label>🛍️ Other Expenses</label>
<input id="other" type="number" placeholder="₱">

<button class="calcbtn" onclick="budgetCalc()">Calculate Budget</button>

<div id="budgetResult" class="result" style="display:none"></div>

</main>

<script>

function openPage(page){
document.getElementById("home").style.display="none";
document.getElementById("salary").style.display="none";
document.getElementById("bir").style.display="none";
document.getElementById("sss").style.display="none";
document.getElementById("pagibig").style.display="none";
document.getElementById("budget").style.display="none";
document.getElementById(page).style.display="block";
}

function home(){
document.getElementById("salary").style.display="none";
document.getElementById("bir").style.display="none";
document.getElementById("sss").style.display="none";
document.getElementById("pagibig").style.display="none";
document.getElementById("budget").style.display="none";
document.getElementById("home").style.display="block";
}

function sssAmount(s){
let m=Math.max(5000,Math.min(35000,Math.ceil(s/500)*500));
return m*0.05;
}

function salaryCalc(){

let s=Number(document.getElementById("salaryInput").value);

if(s<=0){alert("Enter your salary.");return}

let a=sssAmount(s);
let p=s*.025;
let pg=Math.min(s*.02,100);
let taxable=Math.max(0,s-a-p-pg);
let tax=0;

if(taxable<=20833)tax=0;
else if(taxable<=33333)tax=(taxable-20833)*.15;
else if(taxable<=66667)tax=1875+(taxable-33333)*.20;
else if(taxable<=166667)tax=8541.80+(taxable-66667)*.25;
else if(taxable<=666667)tax=33541.80+(taxable-166667)*.30;
else tax=183541.80+(taxable-666667)*.35;

let total=a+p+pg+tax;
let net=s-total;

document.getElementById("salaryResult").style.display="block";

document.getElementById("salaryResult").innerHTML=
"<b>Estimated Deductions</b><br><br>"+
"SSS: ₱"+a.toFixed(2)+"<br>"+
"PhilHealth: ₱"+p.toFixed(2)+"<br>"+
"Pag-IBIG: ₱"+pg.toFixed(2)+"<br>"+
"BIR Tax: ₱"+tax.toFixed(2)+"<br><br>"+
"<b>Total Deductions: ₱"+total.toFixed(2)+"</b><br><br>"+
"<b>Estimated Take-home Pay: ₱"+net.toFixed(2)+"</b>";
}

function birCalc(){

let income=Number(document.getElementById("birInput").value);

if(income<=0){alert("Enter your income.");return}

let tax=0;

if(income<=20833)tax=0;
else if(income<=33333)tax=(income-20833)*.15;
else if(income<=66667)tax=1875+(income-33333)*.20;
else if(income<=166667)tax=8541.80+(income-66667)*.25;
else if(income<=666667)tax=33541.80+(income-166667)*.30;
else tax=183541.80+(income-666667)*.35;

document.getElementById("birResult").style.display="block";

document.getElementById("birResult").innerHTML=
"<b>Estimated Monthly BIR Tax</b><br><br>"+
"Taxable Income: ₱"+income.toFixed(2)+"<br><br>"+
"<b>Estimated Tax: ₱"+tax.toFixed(2)+"</b>";
}

function sssCalc(){

let s=Number(document.getElementById("sssInput").value);

if(s<=0){alert("Enter your salary.");return}

let m=Math.max(5000,Math.min(35000,Math.ceil(s/500)*500));
let employee=m*.05;

document.getElementById("sssResult").style.display="block";

document.getElementById("sssResult").innerHTML=
"<b>Estimated SSS Contribution</b><br><br>"+
"Monthly Salary: ₱"+s.toFixed(2)+"<br>"+
"Monthly Salary Credit: ₱"+m.toFixed(2)+"<br><br>"+
"<b>Employee Contribution: ₱"+employee.toFixed(2)+"</b><br><br>"+
"Note: Estimated amount only.";
}

function pagibigCalc(){

let s=Number(document.getElementById("pagibigInput").value);

if(s<=0){alert("Enter your salary.");return}

let employee;

if(s<=1500){
employee=s*.01;
}else{
employee=s*.02;
}

if(employee>100){
employee=100;
}

document.getElementById("pagibigResult").style.display="block";

document.getElementById("pagibigResult").innerHTML=
"<b>Estimated Pag-IBIG Contribution</b><br><br>"+
"Monthly Salary: ₱"+s.toFixed(2)+"<br><br>"+
"<b>Employee Contribution: ₱"+employee.toFixed(2)+"</b><br><br>"+
"Note: Estimated amount only.";
}

function budgetCalc(){

let income=Number(document.getElementById("budgetIncome").value);

if(income<=0){
alert("Enter your monthly income.");
return;
}

let rent=Number(document.getElementById("rent").value)||0;
let food=Number(document.getElementById("food").value)||0;
let electricity=Number(document.getElementById("electricity").value)||0;
let water=Number(document.getElementById("water").value)||0;
let internet=Number(document.getElementById("internet").value)||0;
let transport=Number(document.getElementById("transport").value)||0;
let family=Number(document.getElementById("family").value)||0;
let debt=Number(document.getElementById("debt").value)||0;
let other=Number(document.getElementById("other").value)||0;

let total=rent+food+electricity+water+internet+transport+family+debt+other;

let remaining=income-total;

document.getElementById("budgetResult").style.display="block";

document.getElementById("budgetResult").innerHTML=
"<b>📊 Budget Summary</b><br><br>"+
"Monthly Income: ₱"+income.toFixed(2)+"<br>"+
"Total Expenses: ₱"+total.toFixed(2)+"<br><br>"+
"<b>Remaining Money: ₱"+remaining.toFixed(2)+"</b><br><br>"+
"💡 Tip: Consider saving part of your remaining money.";
}

</script>

</body>
</html>
